services:
  postgres:
    image: postgres:16-alpine
    container_name: ramen_shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ramen_admin
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: ramen_shop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
volumes:
  pgdata: